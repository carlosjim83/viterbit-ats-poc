services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: viterbit-php
    working_dir: /app
    volumes:
      - .:/app:cached
      - ./docker/php/conf.d/memory-limit.ini:/usr/local/etc/php/conf.d/memory-limit.ini:ro
    networks:
      - viterbit
    depends_on:
      - db
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: viterbit-nginx
    ports:
      - "8080:80"
    volumes:
      - .:/app:cached
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - viterbit
    depends_on:
      - php
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: viterbit-db
    environment:
      POSTGRES_USER: viterbit
      POSTGRES_PASSWORD: viterbit
      POSTGRES_DB: viterbit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - viterbit
    restart: unless-stopped

  messenger:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: viterbit-messenger
    working_dir: /app
    environment:
      - APP_ENV=prod
      - APP_DEBUG=0
    volumes:
      - .:/app:cached
      - ./docker/php/conf.d/memory-limit.ini:/usr/local/etc/php/conf.d/memory-limit.ini:ro
    networks:
      - viterbit
    depends_on:
      - db
    restart: unless-stopped
    command: ["php", "bin/console", "ecotone:run", "enrichment", "-vv"]

volumes:
  pgdata:

networks:
  viterbit:
    driver: bridge
